# Publishes the offline app (app/) to GitHub Pages on every push to main.
# Repo settings → Pages → Source: "GitHub Actions".
name: Deploy app to GitHub Pages
# Manual trigger only while the repo is private (Pages needs a public repo on the free plan).
# When going public: restore `push: {branches: [main]}` under `on:`.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
